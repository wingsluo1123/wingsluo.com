name: Build blog

on:
  push:
    branches: [main, feat/astropaper-blog]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
        env:
          PUBLIC_ICP_NUMBER: ${{ vars.PUBLIC_ICP_NUMBER }}
      - uses: actions/upload-artifact@v4
        with:
          name: wingsluo-blog
          path: dist/
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/feat/astropaper-blog' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: aliyun-production
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wingsluo-blog
          path: dist
      - name: Deploy static build to Aliyun
        env:
          DEPLOY_KEY: ${{ secrets.ALIYUN_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.ALIYUN_KNOWN_HOSTS }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/feat/astropaper-blog" --jq .object.sha)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "A newer commit exists; skipping this release."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          trap 'rm -f ~/.ssh/aliyun_deploy' EXIT
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/aliyun_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/aliyun_deploy ~/.ssh/known_hosts
          export RSYNC_RSH="ssh -i $HOME/.ssh/aliyun_deploy -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o IPQoS=none -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
          for attempt in 1 2 3; do
            if rsync -rltz --checksum --delete-delay --delay-updates --timeout=120 \
              --stats dist/ blogdeploy@120.25.207.55:build/; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "Retrying incremental upload ($attempt/3)."
          done
          ssh -i ~/.ssh/aliyun_deploy -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o IPQoS=none \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            blogdeploy@120.25.207.55 "activate $GITHUB_SHA"
